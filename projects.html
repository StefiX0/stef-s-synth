<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Project Hub | Stepa's Synth</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .project-tag {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 24px;
        }
        .project-tag:hover {
            width: var(--full-width);
        }
        .project-tag span {
            opacity: 0;
            transition: opacity 0.2s;
            transition-delay: 0s;
        }
        .project-tag:hover span {
            opacity: 1;
            transition-delay: 0.1s;
        }
    </style>
</head>
<body class="font-sans min-h-screen text-gray-200 overflow-x-hidden custom-scrollbar">

    <div class="space-background"></div>
    <div class="stars"></div>

    <div class="relative z-10 flex flex-col min-h-screen">
        
        <!-- HEADER -->
        <header class="header-bar p-4 flex justify-between items-center shadow-xl">
            <div class="flex items-center gap-6">
                <h1 class="text-3xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 drop-shadow-lg">
                    Stepa's Synth
                </h1>
                <span class="text-gray-500">/</span>
                <h2 class="text-xl font-bold tracking-widest text-yellow-500 uppercase">Project Hub</h2>
            </div>

            <div class="flex items-center gap-4">
                <a href="index.html" class="glass-button px-6 py-2 rounded-full font-bold uppercase tracking-widest text-xs hover:text-white no-underline border-white/10">
                    Menu
                </a>
                <a href="account.html" class="glass-button flex items-center gap-3 px-4 py-2 rounded-full no-underline hover:border-blue-400 transition-all border-white/10">
                    <div class="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-300 font-bold border border-blue-500/50 text-xs">
                        USR
                    </div>
                    <span id="nav-username" class="font-bold text-sm tracking-widest uppercase">Host</span>
                    <span class="w-3 h-3 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]"></span>
                </a>
            </div>
        </header>

        <main class="flex-grow p-8 max-w-7xl mx-auto w-full">
            
            <div class="text-center mb-16 mt-4">
                <h1 class="text-5xl font-bold tracking-widest text-white uppercase drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]">Vaše projekty</h1>
            </div>

            <!-- Mřížka projektů -->
            <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-12">
                <!-- Zde se vygenerují karty -->
            </div>

        </main>
    </div>

    <!-- Modální okno pro nový projekt -->
    <div id="new-project-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel p-1 rounded-2xl w-full max-w-lg">
            <div class="glass-panel-inner p-8 rounded-2xl flex flex-col gap-6">
                <h3 class="text-2xl font-bold text-yellow-400 uppercase tracking-widest border-b border-white/10 pb-4">Nová inicializace</h3>
                
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Název projektu</label>
                    <input type="text" id="new-project-name" placeholder="Např. Fume Extractor V2" class="glass-textarea w-full rounded-xl p-3 text-sm text-white">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Štítky (Oddělte čárkou)</label>
                    <input type="text" id="new-project-tags" placeholder="Např. Hardware, Kódování, 3D Tisk" class="glass-textarea w-full rounded-xl p-3 text-sm text-white">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Hlavní cíl</label>
                    <textarea id="new-project-desc" placeholder="Stručně popiš, co chceš postavit..." class="glass-textarea w-full rounded-xl p-3 text-sm h-24 custom-scrollbar text-white"></textarea>
                </div>

                <div class="flex justify-end gap-4 mt-4">
                    <button onclick="closeNewProjectModal()" class="glass-button px-6 py-2 rounded-xl font-bold text-xs uppercase tracking-widest text-gray-400 hover:text-white border-white/10">
                        Zrušit
                    </button>
                    <button onclick="createNewProject()" class="glass-button px-6 py-2 rounded-xl font-bold text-xs uppercase tracking-widest text-green-400 border-green-500/30 hover:border-green-400 hover:text-white">
                        Vytvořit
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Ochrana přihlášení a načtení jména
        document.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('SYNTH_USERNAME');
            if (user) {
                document.getElementById('nav-username').innerText = user;
                loadProjects(); // Zavoláme vykreslení
            } else {
                window.location.href = 'login.html'; 
            }
        });

        // Modální okno - otevírání a zavírání
        function openNewProjectModal() {
            document.getElementById('new-project-modal').classList.remove('hidden');
        }

        function closeNewProjectModal() {
            document.getElementById('new-project-modal').classList.add('hidden');
            document.getElementById('new-project-name').value = '';
            document.getElementById('new-project-desc').value = '';
            document.getElementById('new-project-tags').
