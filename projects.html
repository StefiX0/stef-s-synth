<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Project Hub | Stepa's Synth</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .project-tag {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 24px;
        }
        .project-tag:hover {
            width: var(--full-width);
        }
        .project-tag span {
            opacity: 0;
            transition: opacity 0.2s;
            transition-delay: 0s;
        }
        .project-tag:hover span {
            opacity: 1;
            transition-delay: 0.1s;
        }
    </style>
</head>
<body class="font-sans min-h-screen text-gray-200 overflow-x-hidden custom-scrollbar">

    <div class="space-background"></div>
    <div class="stars"></div>

    <div class="relative z-10 flex flex-col min-h-screen">
        
        <!-- HEADER -->
        <header class="header-bar p-4 flex justify-between items-center shadow-xl">
            <div class="flex items-center gap-6">
                <h1 class="text-3xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 drop-shadow-lg">
                    Stepa's Synth
                </h1>
                <span class="text-gray-500">/</span>
                <h2 class="text-xl font-bold tracking-widest text-yellow-500 uppercase">Project Hub</h2>
            </div>

            <div class="flex items-center gap-4">
                <a href="index.html" class="glass-button px-6 py-2 rounded-full font-bold uppercase tracking-widest text-xs hover:text-white no-underline border-white/10">
                    Menu
                </a>
                <a href="account.html" class="glass-button flex items-center gap-3 px-4 py-2 rounded-full no-underline hover:border-blue-400 transition-all border-white/10">
                    <div class="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-300 font-bold border border-blue-500/50 text-xs">
                        USR
                    </div>
                    <span id="nav-username" class="font-bold text-sm tracking-widest uppercase">Host</span>
                    <span class="w-3 h-3 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]"></span>
                </a>
            </div>
        </header>

        <main class="flex-grow p-8 max-w-7xl mx-auto w-full">
            
            <div class="text-center mb-16 mt-4">
                <h1 class="text-5xl font-bold tracking-widest text-white uppercase drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]">Vaše projekty</h1>
            </div>

            <!-- Mřížka projektů -->
            <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-12">
                <!-- Zde se vygenerují karty -->
            </div>

        </main>
    </div>

    <!-- Modální okno pro nový projekt -->
    <div id="new-project-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel p-1 rounded-2xl w-full max-w-lg">
            <div class="glass-panel-inner p-8 rounded-2xl flex flex-col gap-6">
                <h3 class="text-2xl font-bold text-yellow-400 uppercase tracking-widest border-b border-white/10 pb-4">Nová inicializace</h3>
                
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Název projektu</label>
                    <input type="text" id="new-project-name" placeholder="Např. Fume Extractor V2" class="glass-textarea w-full rounded-xl p-3 text-sm text-white">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Štítky (Oddělte čárkou)</label>
                    <input type="text" id="new-project-tags" placeholder="Např. Hardware, Kódování, 3D Tisk" class="glass-textarea w-full rounded-xl p-3 text-sm text-white">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Hlavní cíl</label>
                    <textarea id="new-project-desc" placeholder="Stručně popiš, co chceš postavit..." class="glass-textarea w-full rounded-xl p-3 text-sm h-24 custom-scrollbar text-white"></textarea>
                </div>

                <div class="flex justify-end gap-4 mt-4">
                    <button onclick="closeNewProjectModal()" class="glass-button px-6 py-2 rounded-xl font-bold text-xs uppercase tracking-widest text-gray-400 hover:text-white border-white/10">
                        Zrušit
                    </button>
                    <button onclick="createNewProject()" class="glass-button px-6 py-2 rounded-xl font-bold text-xs uppercase tracking-widest text-green-400 border-green-500/30 hover:border-green-400 hover:text-white">
                        Vytvořit
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // LAPAČ CHYB - Pokud něco spadne, vyhodí to alert
        window.onerror = function(message, source, lineno, colno, error) {
            alert("CHYBA V KÓDU:\n" + message + "\nŘádek: " + lineno);
            return false;
        };

        // Ochrana přihlášení a načtení jména
        document.addEventListener('DOMContentLoaded', () => {
            try {
                const user = localStorage.getItem('SYNTH_USERNAME');
                if (user) {
                    document.getElementById('nav-username').innerText = user;
                    loadProjects(); 
                } else {
                    window.location.href = 'login.html'; 
                }
            } catch (error) {
                alert("Kritická chyba při startu: " + error.message);
            }
        });

        function openNewProjectModal() {
            document.getElementById('new-project-modal').classList.remove('hidden');
        }

        function closeNewProjectModal() {
            document.getElementById('new-project-modal').classList.add('hidden');
            document.getElementById('new-project-name').value = '';
            document.getElementById('new-project-desc').value = '';
            document.getElementById('new-project-tags').value = '';
        }

        const tagColors = ['bg-orange-500', 'bg-blue-500', 'bg-purple-500', 'bg-green-500', 'bg-pink-500', 'bg-cyan-500'];

        function createNewProject() {
            const name = document.getElementById('new-project-name').value.trim();
            const desc = document.getElementById('new-project-desc').value.trim();
            const tagsInput = document.getElementById('new-project-tags').value.trim();
            
            if (!name) {
                alert("Zadej název projektu.");
                return;
            }

            let tags = [];
            if (tagsInput) {
                tags = tagsInput.split(',').map(t => t.trim()).filter(t => t.length > 0);
            }

            const newProject = {
                id: Date.now().toString(),
                name: name,
                description: desc,
                tags: tags,
                progress: 0, 
                createdAt: new Date().toLocaleDateString('cs-CZ')
            };

            let projects = [];
            try {
                projects = JSON.parse(localStorage.getItem('SYNTH_PROJECTS')) || [];
            } catch(e) {
                projects = [];
            }
            
            projects.push(newProject);
            localStorage.setItem('SYNTH_PROJECTS', JSON.stringify(projects));

            closeNewProjectModal();
            loadProjects();
        }

        function loadProjects() {
            const grid = document.getElementById('projects-grid');
            let projects = [];
            
            try {
                projects = JSON.parse(localStorage.getItem('SYNTH_PROJECTS')) || [];
            } catch(e) {
                localStorage.setItem('SYNTH_PROJECTS', '[]');
                projects = [];
            }
            
            grid.innerHTML = ''; 

            // Tvorba karty pro "Vytvořit projekt"
            const addProjectCard = document.createElement('div');
            addProjectCard.className = "flex flex-col justify-center items-center rounded-2xl border-2 border-dashed border-gray-600 text-gray-500 hover:text-white hover:bg-[#1a1a24] hover:border-gray-500 transition-all duration-300 cursor-pointer h-[272px] group w-full relative z-10";
            addProjectCard.onclick = openNewProjectModal;
            
            addProjectCard.innerHTML = `
                <div class="text-6xl font-light mb-2 group-hover:scale-110 transition-transform duration-300">+</div>
                <div class="font-bold tracking-widest uppercase text-sm">Vytvořit projekt</div>
            `;
            grid.appendChild(addProjectCard);

            // Vykreslení existujících projektů
            projects.forEach(proj => {
                const cardWrapper = document.createElement('div');
                cardWrapper.className = "relative w-full group";

                let tagsHtml = '';
                if (proj.tags && proj.tags.length > 0) {
                    tagsHtml = '<div class="absolute -bottom-5 left-6 flex gap-2 z-0">';
                    proj.tags.forEach((tag, index) => {
                        const colorClass = tagColors[index % tagColors.length];
                        const expandedWidth = (tag.length * 8) + 24; 
                        
                        tagsHtml += `
                            <div class="project-tag ${colorClass} h-8 rounded-b-md flex items-end pb-1 overflow-hidden cursor-help shadow-lg border border-black/20" style="--full-width: ${expandedWidth}px;">
                                <span class="text-white font-bold text-[10px] tracking-widest uppercase whitespace-nowrap ml-2">${tag}</span>
                            </div>
                        `;
                    });
                    tagsHtml += '</div>';
                }

                cardWrapper.innerHTML = `
                    <div class="relative z-10 flex flex-col rounded-2xl shadow-[0_8px_30px_rgba(0,0,0,0.5)] transition-transform duration-300 group-hover:-translate-y-2 cursor-pointer border border-white/10" onclick="openProjectDetail('${proj.id}')">
                        <div class="h-48 rounded-t-2xl bg-white/5 backdrop-blur-md flex flex-col relative overflow-hidden">
                            <div class="absolute top-4 left-4 right-4 h-3 bg-black/60 rounded-full overflow-hidden shadow-inner border border-white/10">
                                <div class="h-full bg-gradient-to-r from-purple-600 via-blue-400 to-green-400" style="width: ${proj.progress}%"></div>
                            </div>
                            <div class="flex-grow flex items-center justify-center text-gray-500 tracking-widest text-xs uppercase font-bold mt-8">
                                Fotka projektu
                            </div>
                        </div>
                        <div class="bg-[#121218] p-5 rounded-b-2xl border-t border-white/10 flex flex-col justify-center text-center h-20">
                            <h3 class="text-xl font-bold text-gray-200 tracking-wider">${proj.name}</h3>
                        </div>
                    </div>
                    ${tagsHtml}
                `;
                
                grid.appendChild(cardWrapper);
            });
        }

        function openProjectDetail(projectId) {
            window.location.href = 'project-detail.html?id=' + projectId;
        }
    </script>
