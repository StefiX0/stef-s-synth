<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Stepa's Synth | Menu</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans min-h-screen text-gray-200 overflow-x-hidden custom-scrollbar">

    <div class="space-background"></div>
    <div class="stars"></div>

    <div class="relative z-10 flex flex-col min-h-screen">
        
        <header class="header-bar p-4 flex justify-between items-center shadow-xl">
            <!-- Návrat k původnímu názvu -->
            <h1 class="text-3xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 drop-shadow-lg">
                Stepa's Synth
            </h1>

            <a href="account.html" class="glass-button flex items-center gap-3 px-4 py-2 rounded-full no-underline hover:border-blue-400 transition-all border-white/10">
                <div class="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-300 font-bold border border-blue-500/50 text-xs">
                    USR
                </div>
                <span id="nav-username" class="font-bold text-sm tracking-widest uppercase">Host</span>
                <span class="w-3 h-3 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]"></span>
            </a>
        </header>

        <main class="flex-grow flex items-center justify-center p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-6xl">

                <a href="generator.html" class="glass-button main-choice-btn p-10 rounded-3xl flex items-center justify-center text-center group no-underline">
                    <h2 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400 group-hover:text-white transition-all">
                        Generace kódu
                    </h2>
                </a>

                <a href="humanizer.html" class="glass-button main-choice-btn p-10 rounded-3xl flex items-center justify-center text-center group no-underline">
                    <h2 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 group-hover:text-white transition-all">
                        Stylizace & Humanizer
                    </h2>
                </a>

                <a href="vision.html" class="glass-button main-choice-btn p-10 rounded-3xl flex items-center justify-center text-center group no-underline">
                    <h2 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-400 group-hover:text-white transition-all">
                        Vision Coder
                    </h2>
                </a>

                <a href="school.html" class="glass-button main-choice-btn p-10 rounded-3xl flex items-center justify-center text-center group no-underline">
                    <h2 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300 group-hover:text-white transition-all">
                        Škola & Věda
                    </h2>
                </a>

                <!-- Přesunutý Project Tracker dolů -->
                <a href="projects.html" class="glass-button main-choice-btn p-10 rounded-3xl flex items-center justify-center text-center group no-underline md:col-span-2 border-yellow-500/30 hover:border-yellow-400">
                    <h2 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500 group-hover:text-white transition-all tracking-widest uppercase">
                        Project Tracker
                    </h2>
                </a>

            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('SYNTH_USERNAME');
            if (user) {
                document.getElementById('nav-username').innerText = user;
            } else {
                window.location.href = 'login.html'; 
            }
        });
    </script>
</body>
</html>
