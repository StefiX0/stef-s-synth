<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Login | Stepa's Synth</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans min-h-screen text-gray-200 flex items-center justify-center">

    <div class="space-background"></div>
    <div class="stars"></div>

    <div class="relative z-10 w-full max-w-md p-6">
        
        <!-- Logo -->
        <div class="text-center mb-10">
            <h1 class="text-5xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 drop-shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                SYNTH_OS
            </h1>
            <p class="text-gray-400 mt-2 tracking-widest text-sm">USER AUTHENTICATION</p>
        </div>

        <!-- Login Formular -->
        <div class="glass-panel p-1 rounded-3xl">
            <div class="glass-panel-inner p-8 rounded-3xl flex flex-col gap-6">
                
                <div>
                    <label class="block text-xs font-bold text-blue-400 uppercase tracking-widest mb-2">Uživatelské jméno</label>
                    <input type="text" id="login-username" placeholder="Např. Stepa" class="glass-textarea w-full rounded-xl p-3 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-blue-400 uppercase tracking-widest mb-2">Heslo (zatím demo)</label>
                    <input type="password" id="login-password" placeholder="••••••••" class="glass-textarea w-full rounded-xl p-3 text-sm">
                </div>

                <button onclick="handleLogin()" class="glass-button w-full py-4 rounded-full font-bold tracking-widest uppercase text-blue-300 hover:text-white border-blue-500/50 hover:border-blue-400 mt-4">
                    Přihlásit se do sítě
                </button>
                
            </div>
        </div>

    </div>

    <script src="script.js"></script>
    <script>
        // Jednoduchá simulace loginu
        function handleLogin() {
            const username = document.getElementById('login-username').value.trim();
            if (username.length < 2) {
                alert("Zadej platné jméno.");
                return;
            }
            // Uložíme jméno do paměti a přesměrujeme na hlavní menu
            localStorage.setItem('SYNTH_USERNAME', username);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
