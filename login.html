<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Login | Stepa's Synth</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans min-h-screen text-gray-200 flex items-center justify-center overflow-hidden">

    <div class="space-background"></div>
    <div class="stars"></div>

    <div class="relative z-10 w-full max-w-md p-6">
        
        <div class="text-center mb-10">
            <h1 class="text-5xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 drop-shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                SYNTH_OS
            </h1>
            <p class="text-gray-400 mt-2 tracking-widest text-sm uppercase">Secure Cloud Authentication</p>
        </div>

        <div class="glass-panel p-1 rounded-3xl">
            <div class="glass-panel-inner p-8 rounded-3xl flex flex-col gap-6">
                
                <div>
                    <label class="block text-xs font-bold text-blue-400 uppercase tracking-widest mb-2">E-mail</label>
                    <input type="email" id="login-email" placeholder="agent@synth.os" class="glass-textarea w-full rounded-xl p-3 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-blue-400 uppercase tracking-widest mb-2">Heslo</label>
                    <div class="relative">
                        <input type="password" id="login-password" placeholder="••••••••" class="glass-textarea w-full rounded-xl p-3 text-sm pr-16">
                        <button type="button" onclick="togglePassword()" id="toggle-pwd-btn" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-blue-400 font-bold text-xs tracking-widest uppercase transition-colors">
                            UKAŽ
                        </button>
                    </div>
                </div>

                <div id="error-msg" class="text-red-400 text-xs font-bold hidden text-center">Chyba přihlášení</div>

                <div class="flex flex-col gap-3 mt-2">
                    <button onclick="loginUser()" class="glass-button w-full py-4 rounded-full font-bold tracking-widest uppercase text-blue-300 hover:text-white border-blue-500/50 hover:border-blue-400">
                        Přihlásit se
                    </button>
                    
                    <button onclick="registerUser()" class="glass-button w-full py-3 rounded-full font-bold tracking-widest uppercase text-xs text-gray-400 hover:text-white border-white/10">
                        Vytvořit nový účet
                    </button>
                </div>
                
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDknPhhEs5zKT4gNQsLpRnK24Twgj_ZHQ4",
            authDomain: "stepasynthx.firebaseapp.com",
            projectId: "stepasynthx",
            storageBucket: "stepasynthx.firebasestorage.app",
            messagingSenderId: "339372657",
            appId: "1:339372657:web:0d183c351d7aad2ed849d0",
            measurementId: "G-PD5NCZG9YH"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Funkce pro zobrazení/skrytí hesla
        window.togglePassword = () => {
            const pwdInput = document.getElementById('login-password');
            const pwdBtn = document.getElementById('toggle-pwd-btn');
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                pwdBtn.innerText = 'SKRYJ';
            } else {
                pwdInput.type = 'password';
                pwdBtn.innerText = 'UKAŽ';
            }
        };

        window.loginUser = () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('error-msg');

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const username = email.split('@')[0];
                    // Pokud uživatel nemá nastavené vlastní jméno, dáme mu defaultní z emailu
                    if (!localStorage.getItem('SYNTH_USERNAME')) {
                        localStorage.setItem('SYNTH_USERNAME', username);
                    }
                    window.location.href = 'index.html';
                })
                .catch((error) => {
                    errorDiv.innerText = "Chyba: Špatný e-mail nebo heslo.";
                    errorDiv.classList.remove('hidden');
                });
        };

        window.registerUser = () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('error-msg');

            if(password.length < 6) {
                errorDiv.innerText = "Heslo musí mít aspoň 6 znaků!";
                errorDiv.classList.remove('hidden');
                return;
            }

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const username = email.split('@')[0];
                    localStorage.setItem('SYNTH_USERNAME', username);
                    window.location.href = 'index.html';
                })
                .catch((error) => {
                    errorDiv.innerText = "Chyba při registraci. Účet už možná existuje.";
                    errorDiv.classList.remove('hidden');
                });
        };
    </script>
</body>
</html>
