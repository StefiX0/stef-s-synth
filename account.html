<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Můj Účet | Stepa's Synth</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans min-h-screen text-gray-200">

    <div class="space-background"></div>
    <div class="stars"></div>

    <div class="relative z-10 flex flex-col min-h-screen">
        
        <!-- Header -->
        <header class="header-bar p-4 relative flex items-center justify-center shadow-xl h-20">
            <h1 class="text-2xl font-bold text-blue-400 tracking-wider absolute left-8">NASTAVENÍ ÚČTU</h1>
            <a href="index.html" class="glass-button px-8 py-2 rounded-full font-bold uppercase tracking-widest text-sm hover:text-white no-underline">
                Zpět do Menu
            </a>
        </header>

        <main class="flex-grow flex items-center justify-center p-6 w-full max-w-4xl mx-auto">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full">
                
                <!-- ID Karta -->
                <div class="glass-panel p-1 rounded-3xl">
                    <div class="glass-panel-inner p-8 rounded-3xl flex flex-col items-center text-center">
                        <div class="w-32 h-32 rounded-full bg-blue-500/10 border-2 border-blue-500/50 flex items-center justify-center text-5xl mb-4 relative shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                            👤
                            <!-- Online status dot -->
                            <span class="absolute bottom-2 right-2 w-6 h-6 rounded-full bg-green-500 border-4 border-[#0a0a0f] shadow-[0_0_10px_#22c55e]"></span>
                        </div>
                        <h2 id="acc-username" class="text-3xl font-bold text-white tracking-widest mb-1">USER_NAME</h2>
                        <p class="text-green-400 font-bold text-sm tracking-wider">STATUS: ONLINE</p>
                        
                        <button onclick="handleLogout()" class="glass-button w-full py-3 rounded-full font-bold text-xs uppercase tracking-widest text-red-400 border-red-500/30 hover:border-red-500 hover:text-white mt-8">
                            Odhlásit se
                        </button>
                    </div>
                </div>

                <!-- Systémové nastavení -->
                <div class="glass-panel p-1 rounded-3xl">
                    <div class="glass-panel-inner p-8 rounded-3xl flex flex-col gap-6">
                        <h3 class="text-xl font-bold text-blue-400 uppercase tracking-widest border-b border-white/10 pb-4">Systémová konfigurace</h3>
                        
                        <!-- Zde jsme přesunuli API klíč -->
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Gemini AI Engine Key</label>
                            <input type="password" id="apiKey" placeholder="Vlož svůj tajný API klíč..." class="glass-textarea api-input w-full rounded-xl p-3 text-sm">
                            <p class="text-xs text-gray-500 mt-2">Klíč se automaticky ukládá (Stiskni Enter pro potvrzení).</p>
                        </div>

                        <!-- Cloud Storage (Příprava pro budoucnost) -->
                        <div class="mt-4">
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Cloudové Úložiště (Projekty)</label>
                            <button class="glass-button w-full py-3 rounded-xl text-sm flex items-center justify-center gap-3 border-white/10 opacity-50 cursor-not-allowed" disabled>
                                <span>☁️</span> Připojit Google Drive (Brzy)
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        // Načtení jména
        document.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('SYNTH_USERNAME');
            if (user) {
                document.getElementById('acc-username').innerText = user;
            } else {
                window.location.href = 'login.html'; // Pokud není přihlášen, vyhodíme ho na login
            }
        });

        function handleLogout() {
            localStorage.removeItem('SYNTH_USERNAME');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
